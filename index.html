<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 블라인드 이상형 매칭</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card-glow:hover { box-shadow: 0 12px 30px rgba(236, 72, 153, 0.2); transform: translateY(-3px); }
    </style>
</head>
<body class="bg-gradient-to-br from-rose-50 via-purple-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">

    <div id="app" class="max-w-xl w-full bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-6 md:p-8 text-center relative overflow-hidden border border-white/50">
        <!-- 동적 렌더링 영역 -->
    </div>

    <script>
        // 👉 Render에 배포한 본인의 서버 주소로 변경하세요! (끝에 슬래시 / 제외)
        const API_BASE_URL = "https://your-render-app-name.onrender.com";

        let myGender = null; // 사용자의 성별 ("남" 또는 "여")
        let currentRound = [];
        let nextRound = [];
        let matchIndex = 0;

        const app = document.getElementById('app');

        // 서버에서 프로필 목록 가져오기
        async function fetchProfiles() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/profiles`);
                return await res.json();
            } catch (err) {
                console.error("서버 연결 실패:", err);
                alert("서버와 통신할 수 없습니다. Render 서버 주소를 확인해주세요!");
                return [];
            }
        }

        // 1. 첫 화면: 나의 성별 선택 및 시작
        function renderHome() {
            app.innerHTML = `
                <div class="py-6 fade-in">
                    <div class="inline-block p-4 bg-pink-100 rounded-2xl text-4xl mb-3 shadow-inner">💌</div>
                    <h1 class="text-2xl md:text-3xl font-extrabold text-gray-800 mb-2">실시간 블라인드 이상형 매칭</h1>
                    <p class="text-gray-500 text-xs md:text-sm mb-6 leading-relaxed">
                        내 성별을 선택하면 <b>이성 참여자들의 카드</b>만 모아<br>실시간 이상형 월드컵과 매칭이 진행됩니다!
                    </p>

                    <div class="bg-pink-50/70 p-4 rounded-2xl mb-6 border border-pink-100">
                        <label class="block font-bold text-gray-700 text-sm mb-3">본인의 성별을 선택해 주세요 👇</label>
                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="setMyGender('남')" class="bg-white hover:bg-sky-50 border-2 border-sky-200 text-sky-600 font-bold py-3 rounded-xl transition cursor-pointer text-sm shadow-sm">
                                👦 남성입니다
                            </button>
                            <button onclick="setMyGender('여')" class="bg-white hover:bg-pink-50 border-2 border-pink-200 text-pink-600 font-bold py-3 rounded-xl transition cursor-pointer text-sm shadow-sm">
                                👧 여성입니다
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function setMyGender(gender) {
            myGender = gender;
            renderMenu();
        }

        // 2. 메인 메뉴 화면 (성별 선택 후)
        async function renderMenu() {
            const profiles = await fetchProfiles();
            // 반대 성별의 프로필만 필터링
            const targetProfiles = profiles.filter(p => p.gender !== myGender);

            app.innerHTML = `
                <div class="py-4 fade-in">
                    <div class="flex justify-between items-center mb-4 bg-gray-50 px-3 py-2 rounded-xl text-xs text-gray-600">
                        <span>내 성별: <b>${myGender}성</b> (이성 매칭 모드)</span>
                        <button onclick="renderHome()" class="text-pink-500 font-semibold underline">성별 바꾸기</button>
                    </div>

                    <div class="inline-block p-3 bg-pink-100 rounded-2xl text-3xl mb-2">💖</div>
                    <h2 class="text-xl font-extrabold text-gray-800 mb-4">무엇을 하시겠어요?</h2>

                    <div class="space-y-3">
                        <button onclick="startWorldCup()" class="w-full bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg transition cursor-pointer text-sm">
                            🏆 실시간 이성 이상형 월드컵 시작 (${targetProfiles.length}명 대기중)
                        </button>
                        <button onclick="renderRegisterForm()" class="w-full bg-white border-2 border-pink-200 hover:bg-pink-50 text-pink-600 font-bold py-3.5 px-6 rounded-2xl transition cursor-pointer text-sm shadow-sm">
                            ✍️ 나도 자기소개 카드 등록하기
                        </button>
                        <button onclick="renderProfileList()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 px-6 rounded-2xl transition cursor-pointer text-xs">
                            📋 전체 등록된 카드 구경하기
                        </button>
                    </div>
                </div>
            `;
        }

        // 3. 프로필 등록 폼
        function renderRegisterForm() {
            app.innerHTML = `
                <div class="py-2 fade-in text-left">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold text-gray-800">✍️ 자기소개 카드 등록 (${myGender}성)</h2>
                        <button onclick="renderMenu()" class="text-xs text-gray-400">✕ 닫기</button>
                    </div>
                    
                    <form onsubmit="handleRegister(event)" class="space-y-3 text-xs">
                        <div>
                            <label class="block font-semibold text-gray-700 mb-1">닉네임</label>
                            <input type="text" id="regName" required placeholder="예: 무민사랑꾼" class="w-full p-3 rounded-xl border border-gray-200 bg-gray-50">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block font-semibold text-gray-700 mb-1">이모지</label>
                                <input type="text" id="regEmoji" required value="🐰" maxlength="2" class="w-full p-3 rounded-xl border border-gray-200 bg-gray-50 text-center text-lg">
                            </div>
                            <div>
                                <label class="block font-semibold text-gray-700 mb-1">태그 (#쉼표 구분)</label>
                                <input type="text" id="regTags" required placeholder="#다정함, #외향적" class="w-full p-3 rounded-xl border border-gray-200 bg-gray-50">
                            </div>
                        </div>
                        <div>
                            <label class="block font-semibold text-gray-700 mb-1">한 줄 캐치프레이즈</label>
                            <input type="text" id="regTagline" required placeholder="웃는 모습이 예쁜 사람" class="w-full p-3 rounded-xl border border-gray-200 bg-gray-50">
                        </div>
                        <div>
                            <label class="block font-semibold text-gray-700 mb-1">상세 소개</label>
                            <textarea id="regDesc" required rows="2" placeholder="자신의 연애 스타일을 적어주세요." class="w-full p-3 rounded-xl border border-gray-200 bg-gray-50 resize-none"></textarea>
                        </div>

                        <button type="submit" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-3.5 rounded-xl transition cursor-pointer mt-2 text-sm">
                            서버에 등록하기 🚀
                        </button>
                    </form>
                </div>
            `;
        }

        async function handleRegister(e) {
            e.preventDefault();
            const rawTags = document.getElementById('regTags').value;
            const tags = rawTags.split(',').map(t => t.trim().startsWith('#') ? t.trim() : '#' + t.trim());

            const newProfile = {
                name: document.getElementById('regName').value,
                gender: myGender,
                emoji: document.getElementById('regEmoji').value,
                tagline: document.getElementById('regTagline').value,
                desc: document.getElementById('regDesc').value,
                tags: tags,
                affection: 85, empathy: 85, humor: 80
            };

            const res = await fetch(`${API_BASE_URL}/api/profiles`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newProfile)
            });
            const data = await res.json();
            if (data.success) {
                alert('성공적으로 서버에 등록되었습니다!');
                renderMenu();
            } else {
                alert('등록 중 오류가 발생했습니다.');
            }
        }

        // 4. 전체 카드 구경하기
        async function renderProfileList() {
            const profiles = await fetchProfiles();
            app.innerHTML = `
                <div class="py-2 fade-in text-left">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold text-gray-800">📋 등록된 전체 카드 (${profiles.length}명)</h2>
                        <button onclick="renderMenu()" class="text-xs text-gray-500 bg-gray-100 px-3 py-1 rounded-lg">돌아가기</button>
                    </div>
                    <div class="space-y-2.5 max-h-[360px] overflow-y-auto pr-1">
                        ${profiles.map(p => `
                            <div class="bg-gray-50 border border-gray-200 p-3 rounded-2xl flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <span class="text-2xl bg-white p-2 rounded-xl shadow-xs">${p.emoji}</span>
                                    <div>
                                        <h3 class="font-bold text-gray-800 text-xs">${p.name} (${p.gender === '남' ? '👦' : '👧'}) <span class="text-[10px] text-pink-500 ml-1">선택됨: ${p.votes}회</span></h3>
                                        <p class="text-[11px] text-gray-500">${p.tagline}</p>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // 5. 이상형 월드컵 실행 (이성만 필터링)
        async function startWorldCup() {
            const profiles = await fetchProfiles();
            const targetProfiles = profiles.filter(p => p.gender !== myGender);

            if (targetProfiles.length < 2) {
                alert('매칭 가능한 이성 참여자가 2명 이상 필요합니다! 먼저 카드를 등록해 보세요.');
                return;
            }

            targetProfiles.sort(() => Math.random() - 0.5);
            const count = targetProfiles.length >= 8 ? 8 : targetProfiles.length >= 4 ? 4 : 2;
            currentRound = targetProfiles.slice(0, count);
            nextRound = [];
            matchIndex = 0;
            renderMatch();
        }

        function renderMatch() {
            if (matchIndex >= currentRound.length) {
                currentRound = nextRound;
                if (currentRound.length === 1) {
                    renderResult(currentRound[0]);
                    return;
                }
                matchIndex = 0;
                nextRound = [];
            }

            const c1 = currentRound[matchIndex];
            const c2 = currentRound[matchIndex + 1];
            const roundTitle = currentRound.length === 8 ? "8강전" : currentRound.length === 4 ? "4강전" : "결승전";

            app.innerHTML = `
                <div class="fade-in">
                    <div class="flex justify-between items-center mb-4">
                        <span class="bg-pink-100 text-pink-600 text-xs font-bold px-3 py-1 rounded-full">${roundTitle}</span>
                        <span class="text-gray-400 text-xs font-semibold">Match ${(matchIndex/2)+1} / ${currentRound.length/2}</span>
                    </div>

                    <h2 class="text-xl font-bold text-gray-800 mb-4">내 마음에 더 끌리는 카드는?</h2>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-left">
                        <div onclick="selectCandidate('${c1.id}')" class="card-glow bg-gradient-to-br from-pink-50 to-purple-50 border-2 border-pink-200 p-4 rounded-2xl cursor-pointer transition flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-center mb-1">
                                    <span class="text-3xl">${c1.emoji}</span>
                                    <span class="text-[10px] font-bold text-pink-500 bg-white px-2 py-0.5 rounded-md">선택 👉</span>
                                </div>
                                <h3 class="font-bold text-gray-800 text-base mb-0.5">${c1.name}</h3>
                                <p class="text-xs font-medium text-pink-600 mb-1.5">${c1.tagline}</p>
                                <p class="text-gray-600 text-[11px] leading-relaxed mb-3">${c1.desc}</p>
                            </div>
                            <div class="flex gap-1">${c1.tags.map(t=>`<span class="text-[9px] bg-white/70 px-1.5 py-0.5 rounded">${t}</span>`).join('')}</div>
                        </div>

                        <div onclick="selectCandidate('${c2.id}')" class="card-glow bg-gradient-to-br from-sky-50 to-indigo-50 border-2 border-sky-200 p-4 rounded-2xl cursor-pointer transition flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-center mb-1">
                                    <span class="text-3xl">${c2.emoji}</span>
                                    <span class="text-[10px] font-bold text-sky-600 bg-white px-2 py-0.5 rounded-md">선택 👉</span>
                                </div>
                                <h3 class="font-bold text-gray-800 text-base mb-0.5">${c2.name}</h3>
                                <p class="text-xs font-medium text-sky-600 mb-1.5">${c2.tagline}</p>
                                <p class="text-gray-600 text-[11px] leading-relaxed mb-3">${c2.desc}</p>
                            </div>
                            <div class="flex gap-1">${c2.tags.map(t=>`<span class="text-[9px] bg-white/70 px-1.5 py-0.5 rounded">${t}</span>`).join('')}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function selectCandidate(id) {
            const chosen = currentRound.find(p => p.id == id);
            nextRound.push(chosen);
            matchIndex += 2;
            renderMatch();
        }

        // 6. 우승 결과 및 서버 투표 반영
        async function renderResult(winner) {
            // 서버로 우승 득표수 전송
            await fetch(`${API_BASE_URL}/api/vote`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: winner.id })
            });

            app.innerHTML = `
                <div class="py-2 fade-in">
                    <div class="text-5xl mb-2 animate-bounce">👑</div>
                    <span class="bg-yellow-100 text-yellow-700 text-xs font-bold px-3 py-1 rounded-full">실시간 매칭 최종 우승</span>
                    <h2 class="text-2xl font-extrabold text-gray-800 mt-2 mb-1">${winner.name}</h2>
                    <p class="text-pink-600 font-semibold text-xs mb-3">${winner.tagline}</p>
                    
                    <div class="text-5xl my-2 bg-pink-50 w-16 h-16 mx-auto flex items-center justify-center rounded-2xl shadow-inner">${winner.emoji}</div>
                    <p class="text-gray-600 text-xs bg-gray-50 p-3.5 rounded-xl mb-4 leading-relaxed border border-gray-100 text-left">${winner.desc}</p>

                    <div class="bg-pink-50 p-3.5 rounded-xl mb-5 text-left border border-pink-100">
                        <h4 class="font-bold text-gray-800 text-xs mb-1">💌 쌍방 매칭 전송 완료</h4>
                        <p class="text-gray-600 text-[11px] leading-relaxed">
                            축하합니다! 이 참여자에게 실시간 익명 투표 하트가 전달되었습니다.
                        </p>
                    </div>

                    <button onclick="renderMenu()" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 rounded-xl transition cursor-pointer text-xs">
                        메인으로 돌아가기 🏠
                    </button>
                </div>
            `;
        }

        // 초기 실행
        renderHome();
    </script>
</body>
</html>
